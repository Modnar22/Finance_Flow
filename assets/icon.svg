<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3"/>
      <feComposite operator="out" in="SourceGraphic"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Shine overlay -->
  <rect x="16" y="16" width="480" height="240" rx="96" ry="96" fill="url(#shineGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="420" cy="100" r="60" fill="rgba(255,255,255,0.08)"/>
  <circle cx="90" cy="420" r="80" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Chart bars - left to right -->
  <!-- Bar 1 - small -->
  <rect x="100" y="300" width="50" height="80" rx="8" fill="rgba(255,255,255,0.9)"/>
  
  <!-- Bar 2 - medium -->
  <rect x="170" y="250" width="50" height="130" rx="8" fill="rgba(255,255,255,0.9)"/>
  
  <!-- Bar 3 - tall -->
  <rect x="240" y="180" width="50" height="200" rx="8" fill="rgba(255,255,255,0.9)"/>
  
  <!-- Bar 4 - tallest -->
  <rect x="310" y="140" width="50" height="240" rx="8" fill="rgba(255,255,255,0.95)"/>
  
  <!-- Trend line -->
  <path d="M125 340 L195 280 L265 220 L335 160" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#shadow)"/>
  
  <!-- Trend dots -->
  <circle cx="125" cy="340" r="10" fill="#10b981"/>
  <circle cx="195" cy="280" r="10" fill="#10b981"/>
  <circle cx="265" cy="220" r="10" fill="#10b981"/>
  <circle cx="335" cy="160" r="12" fill="#10b981" stroke="white" stroke-width="3"/>
  
  <!-- Currency symbol -->
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="rgba(255,255,255,0.95)">R$</text>
  
  <!-- Sparkle effects -->
  <path d="M380 120 L385 135 L400 140 L385 145 L380 160 L375 145 L360 140 L375 135 Z" fill="white" opacity="0.8"/>
  <path d="M140 180 L143 188 L151 191 L143 194 L140 202 L137 194 L129 191 L137 188 Z" fill="white" opacity="0.6"/>
</svg>
