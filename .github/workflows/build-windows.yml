name: Build Windows Installer

# Gera o instalador do FinanceFlow no Windows da nuvem e publica como
# asset do Release. Evita o bloqueio do Smart App Control local, que
# impede o electron-builder de executar o .exe intermediario na sua maquina.
#
# Uso:
#   - Dispare manualmente na aba Actions (workflow_dispatch)
#   - Ou envie uma tag: git tag v1.0.0_Windows && git push origin v1.0.0_Windows
#
# O asset FinanceFlow-Setup-1.0.0.exe do release e substituido automaticamente.
# O status de pre-release do release NUNCA e alterado por este workflow.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build:win

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceFlow-Setup
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0_Windows' }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG nao existe. O instalador esta disponivel como artifact desta execucao."
            exit 0
          fi

          # Remove instaladores antigos para evitar duplicata (nome fixo).
          for existing in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
            case "$existing" in
              FinanceFlow-Setup-*.exe)
                echo "Removendo asset antigo: $existing"
                gh release delete-asset "$TAG" "$existing" --yes
                ;;
            esac
          done

          echo "Publicando instalador em $TAG"
          gh release upload "$TAG" "dist/FinanceFlow Setup 1.0.0.exe#FinanceFlow-Setup-1.0.0.exe" --clobber
          echo "Publicado com sucesso."
